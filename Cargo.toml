[package]
name = "wm-node"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Node identity + placement CLI for the wintermute fleet"
license = "MIT"
repository = "https://github.com/j0yen/wm-node"

[[bin]]
name = "wm-node"
path = "src/main.rs"

[lib]
name = "wm_node"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
